name: "Refresh Weather Profile"

on:
  schedule:
    - cron: '0 * * * *' # Tự động chạy mỗi giờ một lần
  workflow_dispatch: # Cho phép bấm nút kích hoạt thủ công bất cứ lúc nào

jobs:
  update-weather:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Weather Data
        run: |
          # Gọi API lấy thời tiết thực tế dạng rút gọn
          WEATHER_INFO=$(curl -s "https://wttr.in")
          UPDATED_TIME=$(date -u -d "+7 hours" "+%H:%M")
          
          # Tạo dòng text hiển thị thời tiết đẹp mắt
          WEATHER_TEXT="🌤️ **Thời tiết hiện tại: $WEATHER_INFO | Cập nhật lúc: $UPDATED_TIME (ICT)**"
          
          # Đọc file template, thay thế thẻ tag và ghi ra file README.md
          sed "s|<!-- WEATHER_FORECAST_NOW -->|$WEATHER_TEXT|g" README.md.template > README.md

      - name: Commit and Push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update dynamic weather content"
            git push origin main
          fi
